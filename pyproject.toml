[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-neon"
version = "0.4.0"
description = "Orquestrador Visual Multi-Agentes para Engenharia Neon (Antigravity, Claude Code, Gemini CLI, Codex & Superset)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Neon Engenharia & DevEx" },
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pac-neon = "pac_neon.cli:main"
pac-neon-server = "pac_neon.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pac_neon*"]

[tool.setuptools.package-data]
pac_neon = [
    "static/*.html",
    "static/**/*",
    "hooks/*.py",
    "hooks/*.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
